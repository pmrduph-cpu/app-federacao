<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Federação de UPHs</title>
<style>
:root{--bg:#eef2ec;--card:#fff;--ink:#1c2a22;--mut:#64706a;--pri:#0f5132;--pri2:#1b7a46;--acc:#b5832a;--acc2:#f4ecd6;--ok:#2f7d4f;--okbg:#e3f3e8;--warn:#b45309;--warnbg:#fdf0dc;--bad:#b42318;--badbg:#fdeceb;--line:#dde4dc;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 96px}
header.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header.top .in{max-width:860px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;letter-spacing:.2px;line-height:1.15}
.brand small{display:block;font-weight:400;opacity:.75;font-size:12px}
.grow{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;text-align:right;line-height:1.2}
.who b{font-size:13.5px;display:block}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--acc2);color:var(--pri);font-weight:700;object-fit:cover;flex:none}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bot .in{max-width:860px;margin:0 auto;display:flex}
nav.bot button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.bot button svg{width:22px;height:22px}
nav.bot button.on{color:var(--pri);font-weight:600}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:26px;color:var(--pri);line-height:1.1}
.kpi span{font-size:12.5px;color:var(--mut)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#f0c6c2}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.full{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:#e6f1ea;color:var(--pri);white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.acc{background:var(--acc2);color:#7a5513}
.badge.fed{background:var(--pri);color:#fff}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .grow{min-width:0;overflow-wrap:break-word}
.mail{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.li .t{font-weight:600}
.li .m{font-size:13px;color:var(--mut)}
.date{flex:none;width:50px;text-align:center;border-radius:10px;background:var(--acc2);padding:5px 0;line-height:1.05}
.date b{display:block;font-size:19px;color:var(--pri)}
.date span{font-size:11px;text-transform:uppercase;color:#7a5513;font-weight:600}
.date.past{background:#e7ebe5}
.date.past b{color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 14px}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri);border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.uphcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;border-top:4px solid var(--pri2)}
.uphcard.pend{border-top-color:var(--acc)}
.uphcard .t{font-weight:700}
.uphcard .m{font-size:13px;color:var(--mut)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{white-space:nowrap;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.tbl td.n,.tbl th.n{text-align:right}
.tblwrap{overflow-x:auto}
tr[data-row] td:first-child,.lote th:first-child{position:sticky;left:0;background:#fff;z-index:1}
.bar{height:6px;background:#e3e8e1;border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.low{background:var(--acc)}
form .f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
form label{font-size:13px;font-weight:600;color:#3b4552}
form .hint{font-size:12px;color:var(--mut);font-weight:400}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;border:1px solid #d6d0c3;border-radius:10px;padding:9px 11px;background:#fff}
textarea{min-height:84px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin:6px 0}
.check input{margin-top:3px}
.alert{border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--warnbg);color:#7c3d06}
.alert.info{background:#e6f1ea;color:var(--pri)}
.alert.ok{background:var(--okbg);color:#1f5535}
.empty{color:var(--mut);font-size:13.5px;padding:8px 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,23,35,.5);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden,.doc.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
.hb{margin-bottom:9px;font-size:13px}
.hbt{height:8px;background:#eef1ec;border-radius:4px;margin-top:3px;overflow:hidden}
.hbt i{display:block;height:100%;border-radius:0 4px 4px 0}
.ia{margin-top:10px;font-size:14px}
.ia h3{font-size:14.5px;margin:12px 0 4px;color:var(--pri)}
.ia ul{margin:4px 0;padding-left:18px}
.ia li{margin:3px 0}
#tip{position:fixed;z-index:95;background:#1c2a22;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;max-width:240px;line-height:1.4}
#tip.on{opacity:1}
nav.bot.six button{font-size:10.5px}
.bell{position:relative;border:0;background:rgba(255,255,255,.12);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.bell svg{width:21px;height:21px}
.bell span{position:absolute;top:-3px;right:-3px;background:#e0a030;color:#1c2a22;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--pri)}
.li.nt.novo{background:linear-gradient(90deg,#eef6f0,transparent)}
.li.nt.novo .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.ni{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:#eef1ec;color:var(--pri)}
.ni svg{width:20px;height:20px}
.ni-pend{background:var(--warnbg);color:var(--warn)}
.ni-comunicado{background:#eaf0f8;color:#2b6cb0}
.mapwrap{position:relative;border-radius:12px;overflow:hidden;background:#f6f8f4;border:1px solid var(--line)}
svg.mapa{display:block;width:100%;height:auto;aspect-ratio:800/520;touch-action:none;cursor:grab}
.mapbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.mapbtns .btn{width:34px;height:34px;justify-content:center;padding:0;font-size:17px}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.chip.on .dot{box-shadow:0 0 0 2px #fff}
ol.rota{margin:0 0 10px;padding-left:0;list-style:none}
ol.rota .nr{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#5f6b66;color:#fff;font-size:12px;align-items:center;justify-content:center;margin-right:8px}
ol.rota li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.wa{background:#e9e4da;border-radius:12px;padding:12px}
.wa .bubble{background:#fff;border-radius:10px 10px 10px 2px;padding:9px 11px 18px;font-size:13.5px;position:relative;max-width:92%;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.wa .hr{position:absolute;right:8px;bottom:3px;font-size:10.5px;color:#8a8f8c}
.mgr{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}
.mgr div{border-radius:8px;padding:5px 2px;text-align:center;font-size:11px;line-height:1.2;border:1px solid var(--line)}
.mgr b{display:block;font-size:12.5px}
.mgr span{display:block;font-size:10.5px;white-space:nowrap}
.mgr .pg{background:var(--okbg);color:var(--ok);border-color:transparent}
.mgr .at{background:var(--badbg);color:var(--bad);border-color:transparent}
.mgr .av{background:#fff;color:var(--mut)}
.mgr .fora{background:#f3f4f2;color:#aab}
.mchk{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.mchk label{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;padding:5px 0;font-size:12.5px;font-weight:600;cursor:pointer}
.mchk label.dis{opacity:.45}
/* ===== modos de tela ===== */
.shell{display:flex;align-items:flex-start}
.shell>main{flex:1;min-width:0}
nav.side{display:none}
.cols>div{min-width:0}
.mgrid>.card{break-inside:avoid}
.modo{display:inline-grid;grid-template-columns:repeat(4,auto);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;max-width:100%}
.modo button{border:0;background:none;padding:7px 10px;font-size:12.5px;cursor:pointer;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
body.m-mobile .modo.lbl,body.m-tablet .modo.lbl{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
body.m-mobile .modo.lbl button,body.m-tablet .modo.lbl button{flex-direction:column;gap:2px;padding:7px 2px;font-size:11.5px}
.modo button svg{width:16px;height:16px}
.modo button.on{background:var(--pri);color:#fff}
body.m-tablet .modal,body.m-desktop .modal{align-items:center}
body.m-tablet .sheet,body.m-desktop .sheet{border-radius:18px;max-width:720px}
body.m-desktop .sheet{max-width:860px;padding:22px 26px 28px}
body.m-tablet nav.bot,body.m-desktop nav.bot{display:none}
body.m-tablet header.top .in,body.m-desktop header.top .in{max-width:none;padding:10px 20px}
body.m-tablet nav.side,body.m-desktop nav.side{display:flex;flex-direction:column;position:sticky;top:57px;height:calc(100vh - 57px);background:#fff;border-right:1px solid var(--line);flex:none;padding:12px 8px;gap:4px;overflow:auto}
nav.side button{border:0;background:none;border-radius:10px;cursor:pointer;color:var(--mut);display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:600;font-size:14px;text-align:left}
nav.side button svg{width:22px;height:22px;flex:none}
nav.side button:hover{background:#f1f5f0}
nav.side button.on{background:#e6f1ea;color:var(--pri)}
nav.side .sp{flex:1}
body.m-tablet nav.side{width:92px}
body.m-tablet nav.side button{flex-direction:column;gap:3px;font-size:11.5px;padding:9px 4px;text-align:center}
body.m-tablet nav.side .modo-side{display:none}
body.m-desktop nav.side{width:236px;padding:16px 12px}
.modo-side{font-size:12px;color:var(--mut);padding:8px 6px}
.modo-side .modo{display:flex;margin-top:6px}
.modo-side .modo button{flex:1;justify-content:center;padding:7px 4px}
body.m-tablet .wrap{max-width:1000px;padding:20px 22px 40px}
body.m-desktop .wrap{max-width:1240px;padding:24px 32px 48px}
body.m-desktop .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
body.m-desktop .cols.wide{grid-template-columns:3fr 2fr}
body.m-tablet .mgrid{column-count:2;column-gap:16px}
body.m-desktop .mgrid{column-count:3;column-gap:16px}
body.m-tablet .kpis,body.m-desktop .kpis{grid-template-columns:repeat(4,1fr)}
body.m-desktop h1{font-size:26px}
body.m-desktop .grid2{grid-template-columns:repeat(3,1fr)}
body.m-desktop .login:not(.novo),body.m-tablet .login:not(.novo){max-width:980px;display:grid;grid-template-columns:1fr 1.1fr;gap:40px;padding-top:56px}
.login .hero{display:none}
body.m-desktop .login.novo,body.m-tablet .login.novo{max-width:760px}
body.m-desktop .login .hero,body.m-tablet .login .hero{display:block;background:var(--pri);color:#fff;border-radius:22px;padding:34px 30px;align-self:start;position:sticky;top:24px}
body.m-desktop .login .hero h1,body.m-tablet .login .hero h1{font-size:30px;color:#fff}
.login .hero p{opacity:.85}
.login .hero li{margin:6px 0;opacity:.9}
body.m-desktop .login .mtop,body.m-tablet .login .mtop{display:none}
body.m-mobile .brand small{display:none}
body.m-mobile .brand{font-size:14.5px}
body.m-mobile .who{font-size:11.5px}
body.m-mobile .who b{font-size:13px}
body.m-mobile header.top .in{gap:8px}
.who .rl{display:block;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.m-mobile .who .rl,body.m-mobile .who b{max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.who{min-width:0;flex-shrink:1}
.brand,.logos,.bell{flex-shrink:0}
/* ajustes finos do celular */
body.m-mobile .li:has(> .btn){flex-wrap:wrap;row-gap:8px}
body.m-mobile .li:has(> .btn) > .grow{flex:1 1 calc(100% - 64px)}
body.m-mobile .li:has(> .btn):not(:has(> .av)) > .grow{flex-basis:100%}
body.m-mobile .li:has(> .btn) > .btn{margin-left:auto}
body.m-mobile .li:has(> .btn) > .btn ~ .btn{margin-left:0}
body.m-mobile .phead{flex-wrap:wrap}
body.m-mobile .li.nt:has(> .btn) > .grow{flex-basis:calc(100% - 48px)}
.brand{white-space:nowrap}
body.m-mobile .phead > .grow{flex:1 1 calc(100% - 80px)}
body.m-mobile .phead h2{font-size:16px}
body.m-mobile .tbl{font-size:12.5px}
body.m-mobile .tbl th,body.m-mobile .tbl td{padding:7px 4px}
body.m-mobile .hide-m{display:none}
body.m-mobile .tabs button{padding:9px 9px;font-size:13.5px}
body.m-mobile h1{font-size:20px}
body.m-mobile .card{padding:12px}
.only-m{display:none}
body.m-mobile .only-m{display:inline}
body.m-mobile .no-m{display:none}
/* moldura quando o modo é forçado numa tela maior */
body.frame-mobile{max-width:430px;margin:0 auto;box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.12);min-height:100vh}
body.frame-mobile nav.bot{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:430px}
body.frame-mobile .sheet{max-width:430px}
body.frame-mobile #toast{max-width:400px}
body.frame-tablet{max-width:1024px;margin:0 auto;box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.12);min-height:100vh}
body.force-desktop{min-width:1100px}
html{background:#dfe6dd}
.sheet .close{float:right;border:0;background:#f1eee7;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.login{max-width:520px;margin:0 auto;padding:28px 16px 40px}
.login .logo{width:64px;height:64px;border-radius:18px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin-bottom:12px}
.persona{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.persona:hover{border-color:var(--pri2)}
.persona .m{font-size:12.5px;color:var(--mut)}
.gbtn{width:100%;justify-content:center;background:#fff;border:1px solid #cfc9bc;padding:11px}
.sep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12.5px;margin:16px 0}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.proto{background:var(--acc2);color:#6b4a10;font-size:12.5px;padding:8px 12px;border-radius:10px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:112px minmax(0,1fr);gap:4px 10px;font-size:13.5px}
.kv dd{overflow-wrap:break-word}
.kv dt{color:var(--mut)}
.kv dd{margin:0}
.logos{display:flex;gap:6px;align-items:center}
.logos img{height:34px;width:auto;background:#fff;border-radius:8px;padding:2px}
.logobox{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
details.multi{border:1px solid #cdd6cc;border-radius:10px;background:#fff}
details.multi summary{padding:9px 11px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.multi summary::after{content:"▾";color:var(--mut)}
details.multi .opts{max-height:260px;overflow:auto;padding:4px 11px 8px;border-top:1px solid var(--line)}
.rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.sig{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px;font-size:13px}
.paper .lhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.paper .lhead img{height:60px;width:auto}
.paper .ata{text-align:justify;white-space:pre-wrap}
.paper .auth{border:1px solid #444;padding:8px;margin-top:14px;font-size:11px}
/* documento para impressão */
.doc{position:fixed;inset:0;z-index:60;background:#cfd8cf;overflow:auto}
.doc-bar{position:sticky;top:0;background:var(--pri);color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:2}
.pwrap{margin:16px auto;max-width:none;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.pwrap .paper{box-shadow:none}
.paper{background:#fff;color:#000;width:794px;box-sizing:border-box;max-width:none;margin:16px auto;padding:36px 40px;font:12.5px/1.45 Arial,Helvetica,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.paper .hd{text-align:center;font-weight:700;margin-bottom:14px;line-height:1.35}
.paper h4{font-size:12.5px;margin:16px 0 6px}
.paper table{width:100%;border-collapse:collapse;margin:6px 0}
.paper th,.paper td{border:1px solid #444;padding:5px 6px;text-align:left;vertical-align:top;overflow-wrap:break-word}
.paper .hash{word-break:break-all}
.paper th{background:#e9e9e9;font-size:11.5px}
.paper td.n{text-align:center}
.paper .sign{display:flex;justify-content:space-around;margin-top:46px;text-align:center}
.paper .sign div{border-top:1px solid #000;padding-top:4px;min-width:220px}
.paper .foot{margin-top:24px;font-size:10px;color:#555;text-align:center}
.paper .pb{page-break-before:always;margin-top:30px}
.paper .ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paper .ph img{width:100%;aspect-ratio:4/3;object-fit:cover}
@media print{
  .paper{zoom:1!important;width:auto;transform:none!important}
  .pwrap{width:auto!important;height:auto!important;box-shadow:none;margin:0}
  body>*:not(#doc){display:none!important}
  #doc{position:static;background:#fff;overflow:visible}
  .doc-bar{display:none}
  .paper{box-shadow:none;margin:0;max-width:none;padding:0}
}

function proximas(lista,n=4){return lista.filter(a=>a.data>=TODAY).sort((a,b)=>a.data.localeCompare(b.data)).slice(0,n)}

function minhasAtv(uid_){return S.atividades.filter(a=>ups(a).includes(uid_)||a.tipo==='federacao'||(a.interessados||[]).includes(uid_))}
function homeView(){
 const s=meS();
 if(can('fed')) return fedHome();
 const u=uph(s.uphId);const pm=prevMonth();
 const entregue=S.individuais.some(r=>r.socioId===s.id&&r.ano===pm.ano&&r.mes===pm.mes);
 const pend=sociosDe(u.id,'pendente');

 return `<h1>Olá, ${esc(s.nome.split(' ')[0])}</h1><p class="sub">UPH da IP ${esc(u.igreja)}</p>
 ${can('approveSocio',u.id)&&pend.length?`<div class="card"><h2>Sócios aguardando sua aprovação (${pend.length})</h2><div class="list">${pend.map(p=>`<div class="li" style="cursor:default">${avatar(p,40)}<div class="grow"><div class="t">${esc(p.nome)}</div><div class="m">${esc(p.oficio)}${p.email?`<span class="mail">${esc(p.email)}</span>`:''}</div></div><button class="btn sm ok" data-a="aprovarSocio" data-id="${p.id}">Aprovar</button><button class="btn sm bad" data-a="recusarSocio" data-id="${p.id}">Recusar</button></div>`).join('')}</div></div>`:''}
 ${!entregue?`<div class="alert warn"><div class="grow">Seu <b>relatório individual de ${MESES[pm.mes-1]}</b> ainda não foi entregue.</div><button class="btn sm acc" data-a="nav" data-id="perfil">Preencher</button></div>`:`<div class="alert ok"><div>Relatório individual de ${MESES[pm.mes-1]} entregue. Obrigado!</div></div>`}
 <div class="kpis"><div class="kpi"><b>${sociosDe(u.id).length}</b><span>sócios ativos</span></div><div class="kpi"><b>${realizadas}</b><span>atividades realizadas em ${ANO}</span></div><div class="kpi"><b>${S.atividades.filter(a=>ups(a).includes(u.id)&&a.data>TODAY).length}</b><span>atividades programadas</span></div></div>
 <div class="cols"><div><div class="card"><div class="between"><h2>Próximas atividades</h2>${can('editUph',u.id)?'<button class="btn sm pri" data-a="novaAtv">+ Registrar atividade</button>':''}</div><div class="list">${proximas(minhasAtv(u.id),6).map(actItem).join('')||'<div class="empty">Nenhuma atividade programada.</div>'}</div></div></div>
 <div>${can('finView',u.id)?finCard(u.id):''}${partResumo(s.id)}</div></div>`}
function fedHome(){
 const at=uphsAtivas();const pend=S.uphs.filter(u=>u.status==='pendente');const pm=prevMonth();
 const rows=at.map(u=>{const ss=sociosDe(u.id);const ent=ss.filter(s=>S.individuais.some(r=>r.socioId===s.id&&r.ano===pm.ano&&r.mes===pm.mes)).length;const real=S.atividades.filter(a=>ups(a).includes(u.id)&&a.data<=TODAY&&ano(a)===ANO).sort((a,b)=>b.data.localeCompare(a.data));const ult=real[0];return {u,n:ss.length,ent,pct:ss.length?Math.round(ent/ss.length*100):0,real:real.length,ult,dias:ult?diffDays(TODAY,ult.data):999,pendS:sociosDe(u.id,'pendente').length}});
 const alertas=[];rows.forEach(r=>{if(r.dias>60)alertas.push(`UPH <b>${esc(r.u.igreja)}</b> está há ${r.dias===999?'mais de 60':r.dias} dias sem registrar atividade realizada.`);if(r.pct<60)alertas.push(`UPH <b>${esc(r.u.igreja)}</b>: só ${r.pct}% dos relatórios individuais de ${MESES[pm.mes-1]} entregues.`)});
 const fs=statsFed();const c=custoAnual();
 const Mn=metasAno(ANO+1);if(!Mn.definidas){const dd=diffDays(Mn.prazo,TODAY);alertas.unshift(dd<0?`As <b>metas de ${ANO+1}</b> não foram definidas e o prazo (${br(Mn.prazo)}) já passou. <a href="#" data-a="nav" data-id="metas">Definir agora</a>`:`Prazo para definir as <b>metas de ${ANO+1}</b>: ${br(Mn.prazo)} (faltam ${dd} dias). <a href="#" data-a="nav" data-id="metas">Abrir metas</a>`)}
 if(Mn.proposta)alertas.unshift(`Há uma <b>proposta de alteração das metas de ${ANO+1}</b> aguardando consenso. <a href="#" data-a="nav" data-id="metas">Ver</a>`);
 const M0=metasAno(ANO);if(M0.proposta)alertas.unshift(`Há uma <b>proposta de alteração das metas de ${ANO}</b> aguardando consenso. <a href="#" data-a="nav" data-id="metas">Ver</a>`);
 const prox=proximas(S.atividades,5);
 return `<h1>Painel da Federação</h1><p class="sub">${esc(S.fed.nome)} · acompanhamento em tempo real de ${ANO}</p>
 <div class="kpis"><div class="kpi"><b>${at.length}</b><span>UPHs ativas</span></div><div class="kpi"><b>${fs.n}</b><span>sócios ativos</span></div><div class="kpi"><b>${S.atividades.filter(a=>a.data<=TODAY&&ano(a)===ANO).length}</b><span>atividades realizadas</span></div><div class="kpi"><b>${pend.length}</b><span>pedidos de UPH</span></div></div>
 <div class="cols wide"><div>
 ${pend.length?`<div class="card"><h2>Pedidos de cadastro de UPH</h2>${pend.map(u=>{const p=holder(u.id,'Presidente');return `<div class="li" style="cursor:default"><div class="grow"><div class="t">UPH da IP ${esc(u.igreja)}</div><div class="m">${esc(endUph(u))}<br>Solicitante: ${esc(p?.nome)} · pedido em ${br(u.solicitadaEm)}<span class="mail">${esc(p?.email)}</span></div></div><button class="btn sm ok" data-a="aprovarUph" data-id="${u.id}">Aprovar</button><button class="btn sm bad" data-a="recusarUph" data-id="${u.id}">Recusar</button></div>`}).join('')}</div>`:''}
 ${alertas.length?`<div class="card"><h2>Alertas</h2>${alertas.map(a=>`<div class="alert warn"><div>${a}</div></div>`).join('')}</div>`:''}
 <div class="card"><h2>Acompanhamento das UPHs</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>UPH</th><th class="n">Sócios</th><th class="n hide-m">Atividades</th><th class="n">Rel. ${MES3[pm.mes-1]}</th><th class="n">Freq.</th><th class="hide-m">Última atividade</th></tr></thead><tbody>${rows.map(r=>`<tr data-a="abrirUph" data-id="${r.u.id}" style="cursor:pointer"><td><b>${esc(r.u.igreja)}</b>${r.pendS?` <span class="badge warn">${r.pendS} pend.</span>`:''}</td><td class="n">${r.n}</td><td class="n hide-m">${r.real}</td><td class="n">${r.pct}%<div class="bar"><i class="${r.pct<60?'low':''}" style="width:${r.pct}%"></i></div></td><td class="n">${partUph(r.u.id)}%</td><td class="hide-m">${r.ult?br(r.ult.data):'—'}</td></tr>`).join('')}</tbody></table></div></div>
 </div><div>
 <div class="card"><div class="between"><h2>Próximas atividades</h2><button class="btn sm pri" data-a="novaAtv">+ Atividade da Federação</button></div><div class="list">${prox.map(actItem).join('')||'<div class="empty">Nada programado.</div>'}</div></div>
 <div class="card"><div class="between"><h2>Avisos automáticos</h2><button class="btn sm pri" data-a="nav" data-id="avisos">Central</button></div><p class="sub" style="margin-bottom:0">Lembretes 7, 4 e 2 dias antes e no dia, como notificação no app, para todos os sócios das UPHs envolvidas. Para grupos e listas do WhatsApp, use "Abrir no WhatsApp", com texto pronto e editável. Sem custo por mensagem.</p></div>
 ${finResumoFed()}
 </div></div>`}
function finResumoFed(){const rows=uphsAtivas().map(u=>({r:resumoFin(u.id),pc:perCapita(u.id)}));const neg=rows.filter(x=>x.r.saldo<0).length,pend=rows.filter(x=>x.pc.rep<x.pc.dev).length,n=rows.reduce((a,x)=>a+x.r.n,0),c=rows.reduce((a,x)=>a+x.r.comp,0);
 return `<div class="card"><div class="between"><h2>Saúde financeira das UPHs</h2><button class="btn sm pri" data-a="abrirFin" data-id="todas">Abrir</button></div><div class="kv"><dt>Saldo negativo</dt><dd><b style="${neg?'color:var(--bad)':''}">${neg}</b> UPH(s)</dd><dt>Per capita pendente</dt><dd><b>${pend}</b> UPH(s)</dd><dt>Comprovantes</dt><dd><b>${n?Math.round(c/n*100):100}%</b> dos lançamentos</dd></div></div>`}
function tesourariaCard(){return `<div class="card"><h2>Tesouraria</h2><div class="alert info"><div>Módulo da Fase 2: entradas (oferta com finalidade e per capita), saídas com comprovante em PDF ou imagem, painel em tempo real e gráficos de evolução.</div></div></div>`}

 </div>
 ${fut&&a.tipo!=='participacao'?`<div class="card" style="background:#faf8f3"><h3>Lembretes automáticos desta atividade</h3><div class="m" style="font-size:13px;color:var(--mut);margin-bottom:6px">${envios(a).map(e=>`${e.d?e.d+' dias antes':'No dia'} (${br(e.data)})${e.data<TODAY?' ✓ enviado':''}`).join(' · ')}</div>

const WIN={0x20AC:128,0x201A:130,0x0192:131,0x201E:132,0x2026:133,0x2020:134,0x2021:135,0x02C6:136,0x2030:137,0x0160:138,0x2039:139,0x0152:140,0x017D:142,0x2018:145,0x2019:146,0x201C:147,0x201D:148,0x2022:149,0x2013:150,0x2014:151,0x02DC:152,0x2122:153,0x0161:154,0x203A:155,0x0153:156,0x017E:158,0x0178:159};
const SUBST={'✓':'v','✔':'v','○':'o','●':'•','◆':'•','≈':'~','→':'->',' ':' ','−':'-','≥':'>=','≤':'<=','​':''};
const pf=n=>(Math.round(n*100)/100).toString();
function encPdf(s){const out=[];for(const ch of s){const r=SUBST[ch];if(r!==undefined){for(const c2 of r){const k=c2.codePointAt(0);out.push(k<127?k:(WIN[k]||(k>=160&&k<=255?k:63)))}continue}const c=ch.codePointAt(0);if(c===9||c===10||c===13)out.push(32);else if(c>=32&&c<127)out.push(c);else if(c>=160&&c<=255)out.push(c);else if(WIN[c])out.push(WIN[c]);else out.push(63)}return out}
const wCodes=(codes,b,size)=>{const W=b?FW_B:FW_R;let t=0;for(const c of codes)t+=W[c]||556;return t*size/1000};
function litPdf(codes){let s='';for(const c of codes){if(c===40||c===41||c===92)s+='\\'+String.fromCharCode(c);else if(c<32||c>126)s+='\\'+c.toString(8).padStart(3,'0');else s+=String.fromCharCode(c)}return s}
function b64bytes(d){const b=atob(d.split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function jpegDims(u){let i=2;while(i<u.length){if(u[i]!==0xFF){i++;continue}const m=u[i+1];const len=(u[i+2]<<8)+u[i+3];if(m>=0xC0&&m<=0xC2)return {h:(u[i+5]<<8)+u[i+6],w:(u[i+7]<<8)+u[i+8],c:u[i+9]};i+=2+len}return null}
class PDFDoc{
 constructor(){this.W=595.28;this.H=841.89;this.M={l:42,r:42,t:46,b:54};this.pages=[];this.imgs=[];this.newPage()}
 newPage(){this.cur=[];this.pages.push(this.cur);this.y=this.M.t;if(this.onNewPage)this.onNewPage()}
 get cw(){return this.W-this.M.l-this.M.r}
 get bottom(){return this.H-this.M.b}
 ensure(h){if(this.y+h>this.bottom&&this.y>this.M.t+1){this.newPage();return true}return false}
 txt(x,base,codes,b,size,gray=0,tw=0){if(!codes.length)return;this.cur.push(`BT /${b?'F2':'F1'} ${pf(size)} Tf ${pf(gray)} g ${tw?pf(tw)+' Tw ':''}${pf(x)} ${pf(this.H-base)} Td (${litPdf(codes)}) Tj ${tw?'0 Tw ':''}ET`)}
 rect(x,y,w,h,fill,stroke=true,lw=.6){this.cur.push(`${pf(lw)} w 0 G ${fill!==undefined?pf(fill)+' g ':''}${pf(x)} ${pf(this.H-y-h)} ${pf(w)} ${pf(h)} re ${fill!==undefined&&stroke?'B':fill!==undefined?'f':'S'} 0 g`)}
 line(x1,y1,x2,y2,lw=.6){this.cur.push(`${pf(lw)} w 0 G ${pf(x1)} ${pf(this.H-y1)} m ${pf(x2)} ${pf(this.H-y2)} l S`)}
 img(data,x,y,w,h){const u=b64bytes(data);const d=jpegDims(u);if(!d)return;const i=this.imgs.length;this.imgs.push({u,...d});this.cur.push(`q ${pf(w)} 0 0 ${pf(h)} ${pf(x)} ${pf(this.H-y-h)} cm /Im${i} Do Q`)}
 build(){const enc=new TextEncoder();const parts=[];let pos=0;const offs=[];const add=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);pos+=b.length};
  const np=this.pages.length,ni=this.imgs.length;const fontStart=3,imgStart=5,pageStart=5+ni;const total=4+ni+np*2;
  const obj=(n,body)=>{offs[n]=pos;add(`${n} 0 obj\n`);if(typeof body==='string')add(body);else body();add(`\nendobj\n`)};
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Count ${np} /Kids [${this.pages.map((_,i)=>`${pageStart+i*2} 0 R`).join(' ')}] >>`);
  obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  this.imgs.forEach((im,i)=>obj(imgStart+i,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /${im.c===1?'DeviceGray':im.c===4?'DeviceCMYK':'DeviceRGB'} /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.u.length} >>\nstream\n`);add(im.u);add('\nendstream')}));
  const xo=this.imgs.map((_,i)=>`/Im${i} ${imgStart+i} 0 R`).join(' ');
  this.pages.forEach((ops,i)=>{const pn=pageStart+i*2;const content=ops.join('\n');
   obj(pn,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pf(this.W)} ${pf(this.H)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${ni?` /XObject << ${xo} >>`:''} >> /Contents ${pn+1} 0 R >>`);
   obj(pn+1,`<< /Length ${enc.encode(content).length} >>\nstream\n${content}\nendstream`)});
  const xref=pos;add(`xref\n0 ${total+1}\n0000000000 65535 f \n`);for(let n=1;n<=total;n++)add(String(offs[n]).padStart(10,'0')+' 00000 n \n');
  add(`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const out=new Uint8Array(pos);let o=0;parts.forEach(p=>{out.set(p,o);o+=p.length});return out}
}

function runsDe(node,b=false,out=[]){node.childNodes.forEach(n=>{if(n.nodeType===3){const t=n.textContent.replace(/\s+/g,' ');if(t)out.push({t,b})}else if(n.nodeType===1){const tg=n.tagName;if(tg==='BR'){out.push({br:1});return}if(/^(IMG|STYLE|SCRIPT|BUTTON|INPUT)$/.test(tg))return;const fw=n.style&&n.style.fontWeight;const nb=(b||tg==='B'||tg==='STRONG'||fw==='700'||fw==='bold')&&fw!=='400';runsDe(n,nb,out);if(/^(DIV|P|LI|H4)$/.test(tg))out.push({br:1})}});return out}
function quebrar(runs,maxW,size){const lines=[];let cur=[],w=0,sp=null;
 const push=()=>{lines.push({segs:cur,w});cur=[];w=0;sp=null};
 const addSeg=(codes,b)=>{const sw=wCodes(codes,b,size);const last=cur[cur.length-1];if(last&&last.b===b){last.codes=last.codes.concat(codes);last.w+=sw}else cur.push({codes,b,w:sw});w+=sw};
 for(const r of runs){if(r.br){if(cur.length||lines.length)push();continue}
  for(const tok of r.t.split(/(\s+)/)){if(!tok)continue;if(/^\s+$/.test(tok)){if(cur.length)sp={b:r.b};continue}
   let codes=encPdf(tok);let tw=wCodes(codes,r.b,size);const spW=sp?wCodes([32],sp.b,size):0;
   if(cur.length&&w+spW+tw>maxW)push();
   else if(sp&&cur.length){addSeg([32],sp.b)}
   sp=null;
   while(tw>maxW){let k=codes.length;while(k>1&&wCodes(codes.slice(0,k),r.b,size)>maxW-w)k--;if(cur.length&&k<=1){push();continue}addSeg(codes.slice(0,k),r.b);push();codes=codes.slice(k);tw=wCodes(codes,r.b,size)}
   if(codes.length)addSeg(codes,r.b)}}
 if(cur.length)push();while(lines.length&&!lines[lines.length-1].segs.length)lines.pop();return lines}
function desenharLinhas(d,lines,x,maxW,size,{align='left',lh=1.3,gray=0,justify=false}={}){const L=size*lh;
 lines.forEach((ln,i)=>{d.ensure(L);let x0=x;const spaces=ln.segs.reduce((n,s)=>n+s.codes.filter(c=>c===32).length,0);
  let tw=0;if(justify&&i<lines.length-1&&spaces&&ln.w>maxW*.75)tw=(maxW-ln.w)/spaces;
  if(align==='center')x0=x+(maxW-ln.w)/2;else if(align==='right')x0=x+maxW-ln.w;

function tabelaPdf(d,tb){const rows=[...tb.querySelectorAll('tr')];if(!rows.length)return;
 const ncol=Math.max(...rows.map(r=>[...r.children].reduce((n,c)=>n+(+c.getAttribute('colspan')||1),0)));
 const cw=d.cw;let ws=new Array(ncol).fill(null);
 const ref=rows.find(r=>r.children.length===ncol)||rows[0];[...ref.children].forEach((c,i)=>{const m=(c.style.width||'').match(/([\d.]+)%/);if(m&&i<ncol)ws[i]=cw*parseFloat(m[1])/100});
 const fixo=ws.reduce((n,v)=>n+(v||0),0);const livres=ws.filter(v=>v===null).length;ws=ws.map(v=>v===null?Math.max(30,(cw-fixo)/Math.max(1,livres)):v);
 const sc=cw/ws.reduce((a,b)=>a+b,0);ws=ws.map(v=>v*sc);
 const size=8.6,pad=4,L=size*1.28;
 const prep=r=>{let ci=0;return [...r.children].map(c=>{const span=+c.getAttribute('colspan')||1;const w=ws.slice(ci,ci+span).reduce((a,b)=>a+b,0);const x=ws.slice(0,ci).reduce((a,b)=>a+b,0);ci+=span;const th=c.tagName==='TH';const lines=quebrar(runsDe(c,th),w-pad*2,size);return {x,w,th,lines,al:c.classList.contains('n')?'center':alinh(c)}})};
 const head=[...rows[0].children].every(c=>c.tagName==='TH')&&rows.length>1&&rows[0].closest('thead')?prep(rows[0]):null;
 const draw=cells=>{const h=Math.max(...cells.map(c=>Math.max(1,c.lines.length)))*L+pad*2;
  if(d.y+h>d.bottom&&d.y>d.M.t+1){d.newPage();if(head&&cells!==head)draw(head)}
  const y0=d.y;cells.forEach(c=>{d.rect(d.M.l+c.x,y0,c.w,h,c.th?.9:undefined,true,.5);d.y=y0+pad;desenharLinhas(d,c.lines,d.M.l+c.x+pad,c.w-pad*2,size,{align:c.al,lh:1.28})});d.y=y0+h};
 rows.forEach((r,i)=>draw(i===0&&head?head:prep(r)));d.y+=6}

async function prepImgsPdf(root){for(const im of root.querySelectorAll('img')){const s=im.getAttribute('src')||'';if(s.startsWith('data:image/jpeg'))continue;
 await new Promise(res=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(i,0,0);im.setAttribute('src',c.toDataURL('image/jpeg',.9));res()};i.onerror=res;if(/^https?:/.test(s)){fetch(s).then(r=>r.blob()).then(b=>{i.src=URL.createObjectURL(b)}).catch(res)}else i.src=s})}}
function imgFit(d,im,x,y,bw,bh){const s=im.getAttribute('src');if(!s||!s.startsWith('data:image/jpeg'))return 0;const dm=jpegDims(b64bytes(s));if(!dm)return 0;const k=Math.min(bw/dm.w,bh/dm.h);const w=dm.w*k,h=dm.h*k;d.img(s,x+(bw-w)/2,y+(bh-h)/2,w,h);return h}
function blocoPdf(d,el){
 if(el.nodeType===3){const t=el.textContent.trim();if(t){desenharLinhas(d,quebrar([{t,b:false}],d.cw,9.5),d.M.l,d.cw,9.5);d.y+=4}return}

 if(cl.contains('lhead')){const ims=[...el.querySelectorAll(':scope > img')];const hd=el.querySelector('.hd');const lw=ims.length?70:0;const mw=d.cw-lw*2;const lines=quebrar(runsDe(hd,true),mw,10.5);const th=lines.length*10.5*1.3;const H=Math.max(th,ims.length?48:0);d.ensure(H);const y0=d.y;
  if(ims[0])imgFit(d,ims[0],d.M.l,y0,lw-8,H);if(ims[1])imgFit(d,ims[1],d.M.l+d.cw-lw+8,y0,lw-8,H);d.y=y0+(H-th)/2;desenharLinhas(d,lines,d.M.l+lw,mw,10.5,{align:'center'});d.y=y0+H+10;return}
 if(cl.contains('hd')){desenharLinhas(d,quebrar(runsDe(el,el.style.fontWeight!=='400'),d.cw,10.5),d.M.l,d.cw,10.5,{align:'center'});d.y+=8;return}
 if(tg==='H4'){d.ensure(10*1.3+40);d.y+=8;desenharLinhas(d,quebrar(runsDe(el,true),d.cw,10),d.M.l,d.cw,10);d.y+=3;return}
 if(tg==='P'){const small=/^(1[01]|[0-9])px$/.test(el.style.fontSize||'');const sz=small?8:9.5;desenharLinhas(d,quebrar(runsDe(el),d.cw,sz),d.M.l,d.cw,sz,{align:alinh(el)});d.y+=6;return}
 if(tg==='TABLE'){tabelaPdf(d,el);return}
 if(cl.contains('ata')){desenharLinhas(d,quebrar(runsDe(el),d.cw,10),d.M.l,d.cw,10,{lh:1.5,justify:true});d.y+=8;return}
 if(cl.contains('sign')){const cols=[...el.children];d.ensure(80);d.y+=34;const y0=d.y;const w=d.cw/cols.length;let maxY=y0;
  cols.forEach((c,i)=>{const x=d.M.l+i*w;d.line(x+20,y0,x+w-20,y0,.6);d.y=y0+4;desenharLinhas(d,quebrar(runsDe(c),w-40,9),x+20,w-40,9,{align:'center'});maxY=Math.max(maxY,d.y)});d.y=maxY+10;return}
 if(cl.contains('auth')){const lines=quebrar(runsDe(el),d.cw-14,8),L=8*1.3;const h=lines.length*L+12;if(h<d.bottom-d.M.t)d.ensure(h);d.y+=6;const y0=d.y;
  if(y0+h<=d.bottom){d.rect(d.M.l,y0,d.cw,h,.96,true,.6);d.y=y0+6;desenharLinhas(d,lines,d.M.l+7,d.cw-14,8,{lh:1.3});d.y=y0+h+6}else{desenharLinhas(d,lines,d.M.l+7,d.cw-14,8,{lh:1.3});d.y+=6}return}
 if(cl.contains('foot')){d.y+=8;desenharLinhas(d,quebrar(runsDe(el),d.cw,6.8),d.M.l,d.cw,6.8,{align:'center',gray:.35});return}
 if(cl.contains('pb')){d.newPage();[...el.childNodes].forEach(c=>blocoPdf(d,c));return}
 if(cl.contains('ph')){const ims=[...el.querySelectorAll('img')];const g=8,w=(d.cw-g*2)/3,h=w*.75;ims.forEach((im,i)=>{if(i%3===0){d.ensure(h);if(i)d.y+=g}imgFit(d,im,d.M.l+(i%3)*(w+g),d.y,w,h);if(i%3===2||i===ims.length-1)d.y+=h});d.y+=8;return}
 if(tg==='IMG'||tg==='SPAN'&&!el.textContent.trim())return;
 const hgt=(el.style&&el.style.height||'').match(/^(\d+)px$/);if(hgt&&!el.textContent.trim()){d.y+=+hgt[1]*.75;return}
 if([...el.children].some(c=>/^(DIV|TABLE|P|H4)$/.test(c.tagName))){[...el.childNodes].forEach(c=>blocoPdf(d,c));return}
 const r=runsDe(el);if(r.some(x=>x.t&&x.t.trim())){desenharLinhas(d,quebrar(r,d.cw,9.5),d.M.l,d.cw,9.5,{align:alinh(el)});d.y+=5}}

async function sbFetch(path,{method='GET',body,headers={},raw=false,auth=true}={}){
 if(auth&&SESS)await refrescarSessao();
 const h={apikey:SB_KEY,...headers};
 if(auth&&SESS&&SESS.access_token)h.Authorization='Bearer '+SESS.access_token;
 if(body!==undefined&&!(body instanceof Blob)&&!h['Content-Type']){h['Content-Type']='application/json';body=JSON.stringify(body)}
 const r=await fetch(SB_URL+path,{method,headers:h,body});
 if(raw)return r;
 const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
 if(!r.ok){const m=j&&(j.message||j.msg||j.error_description||j.error)||tx||r.statusText;throw new SbErr(m,r.status)}
 return j;
}

let _refr=null;
async function refrescarSessao(forcar){
 if(!SESS||!SESS.refresh_token)return;
 if(!forcar&&SESS.expires_at-60>Date.now()/1000)return;
 if(_refr)return _refr;
 _refr=(async()=>{try{const s=await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:SESS.refresh_token},auth:false});guardarSessao(s)}catch(e){if(e.status>=400&&e.status<500){guardarSessao(null)}}finally{_refr=null}})();
 return _refr;
}

function dataUrlBlob(d){const [h,b]=d.split(',');const ct=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:ct})}

async function enviarArquivo(bucket,caminho,dataUrl){const b=dataUrlBlob(dataUrl);await sbFetch(`/storage/v1/object/${bucket}/${caminho}`,{method:'POST',body:b,headers:{'Content-Type':b.type}});return caminho}
async function assinarUrls(bucket,paths){paths=[...new Set(paths.filter(p=>p&&!URLS[bucket+':'+p]))];if(!paths.length)return;
 for(let i=0;i<paths.length;i+=200){const lote=paths.slice(i,i+200);try{const r=await sbFetch(`/storage/v1/object/sign/${bucket}`,{method:'POST',body:{expiresIn:60*60*24*6,paths:lote}});(r||[]).forEach(x=>{if(x.signedURL){const u=(x.signedURL.startsWith('http')?'':SB_URL+'/storage/v1')+x.signedURL;URLS[bucket+':'+x.path]=u;PATHS[u]=x.path}})}catch(e){console.warn(e)}}}
const urlDe=(bucket,p)=>p?(URLS[bucket+':'+p]||null):null;
const publicUrl=(bucket,p)=>`${SB_URL}/storage/v1/object/public/${bucket}/${p}`;
async function logoDataUrl(p){if(!p)return null;try{const r=await fetch(publicUrl('logos',p));if(!r.ok)return null;const b=await r.blob();const d=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)});PATHS[d]=p;return d}catch(e){return null}}
async function abrirArquivo(bucket,p){if(!p)return null;if(!URLS[bucket+':'+p])await assinarUrls(bucket,[p]);return URLS[bucket+':'+p]}

 S.atividades.forEach(a=>(a.fotos||[]).forEach(x=>{if(x&&x.startsWith('data:')&&!PATHS[x])novos.push(['fotos',`atv/${a.id}/${uid()}.${extDe(x)}`,x])}));
 if(S.fed.logoIpb&&S.fed.logoIpb.startsWith('data:')&&!PATHS[S.fed.logoIpb])novos.push(['logos',`ipb-${uid()}.${extDe(S.fed.logoIpb)}`,S.fed.logoIpb]);

 // comprovantes: chave provisória -> caminho no Storage

 for(const l of ord){if(!l.anexo||String(l.anexo).includes('/'))continue;const d=S.anexos[l.anexo];if(!d||!String(d).startsWith('data:'))continue;

}

/* capacidades do aparelho: baixar PDF e ditado por voz */
function initCaps(){
 caps.downloads={save:async({filename,data})=>{const file=new File([data],filename,{type:data.type||'application/pdf'});
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename});return}catch(e){if(e&&e.name==='AbortError')throw {code:'declined'}}}
  const u=URL.createObjectURL(file);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},5000)}};
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
 const h={p:()=>{},f:()=>{},s:()=>{}};let rec=null,ligado=false;
 const d={onPartial:f=>h.p=f,onFinal:f=>h.f=f,onState:f=>h.s=f,
  start:()=>new Promise((res,rej)=>{rec=new SR();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;ligado=true;
   rec.onresult=e=>{let parc='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)h.f({text:t.trim()});else parc+=t}h.p({text:parc})};
   rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){ligado=false;h.s({state:'idle'});rej({code:'not_granted'})}};
   rec.onend=()=>{if(ligado){try{rec.start()}catch(e){ligado=false;h.s({state:'idle'})}}else h.s({state:'idle'})};
   rec.onstart=()=>{h.s({state:'listening'});res()};
   try{rec.start()}catch(e){ligado=false;rej(e)}}),
  stop:()=>{ligado=false;try{rec&&rec.stop()}catch(e){}h.s({state:'idle'});return Promise.resolve()}};
 caps.dictation=d;setupDict(d);
}

/* ============ MAPA REAL (OpenStreetMap) — componente próprio, sem bibliotecas ============ */
const TILE_URL='https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const PI=Math.PI;
const proj=(lat,lng,z)=>{const s=256*2**z;const r=lat*PI/180;return [(lng+180)/360*s,(1-Math.log(Math.tan(r)+1/Math.cos(r))/PI)/2*s]};
const unproj=(x,y,z)=>{const s=256*2**z;const n=PI-2*PI*y/s;return [+(180/PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)))).toFixed(6),+(x/s*360-180).toFixed(6)]};
class MiniMapa{
 constructor(el,o){this.el=el;this.o=o;this.z=o.zoom||13;this.c=o.center;this.mk=[];el.classList.add('mm');
  el.innerHTML=`<div class="mm-t"></div><div class="mm-m"></div><div class="mm-b"><button type="button" aria-label="Aproximar">+</button><button type="button" aria-label="Afastar">−</button></div><div class="mm-a">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>`;
  this.T=el.querySelector('.mm-t');this.M=el.querySelector('.mm-m');this.tiles={};
  const [bi,bo]=el.querySelectorAll('.mm-b button');bi.onclick=e=>{e.stopPropagation();this.zoomEm(1)};bo.onclick=e=>{e.stopPropagation();this.zoomEm(-1)};
  this.ptrs=new Map();
  el.addEventListener('pointerdown',e=>this.down(e));el.addEventListener('pointermove',e=>this.move(e));
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,e=>this.up(e)));
  el.addEventListener('wheel',e=>{e.preventDefault();const n=Date.now();if(n-(this._w||0)<250)return;this._w=n;const r=el.getBoundingClientRect();this.zoomEm(e.deltaY<0?1:-1,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  this.ro=new ResizeObserver(()=>this.desenhar());this.ro.observe(el);
 }
 get W(){return this.el.clientWidth}get H(){return this.el.clientHeight}
 centroPx(){return proj(this.c[0],this.c[1],this.z)}
 paraTela(lat,lng){const [cx,cy]=this.centroPx();const [x,y]=proj(lat,lng,this.z);return [x-cx+this.W/2,y-cy+this.H/2]}
 daTela(px,py){const [cx,cy]=this.centroPx();return unproj(cx+px-this.W/2,cy+py-this.H/2,this.z)}
 zoomEm(d,px,py){const nz=Math.max(3,Math.min(19,this.z+d));if(nz===this.z)return;px=px??this.W/2;py=py??this.H/2;
  const ll=this.daTela(px,py);this.z=nz;const [x,y]=proj(ll[0],ll[1],nz);this.c=unproj(x-(px-this.W/2),y-(py-this.H/2),nz);this.desenhar();this.mudou()}
 enquadrar(pts,zmax=16){if(!pts.length)return;if(pts.length===1){this.c=[pts[0][0],pts[0][1]];this.z=Math.min(zmax,15);return this.desenhar()}
  const la=pts.map(p=>p[0]),lo=pts.map(p=>p[1]);const b=[Math.min(...la),Math.min(...lo),Math.max(...la),Math.max(...lo)];
  let z=zmax;for(;z>3;z--){const [x0,y0]=proj(b[2],b[1],z),[x1,y1]=proj(b[0],b[3],z);if(x1-x0<this.W*.8&&y1-y0<this.H*.6)break}
  this.z=z;const [x0,y0]=proj(b[2],b[1],z),[x1,y1]=proj(b[0],b[3],z);this.c=unproj((x0+x1)/2,(y0+y1)/2-18,z);this.desenhar()}
 marcadores(l){this.mk=l;this.M.innerHTML='';l.forEach((m,i)=>{const d=document.createElement('div');d.className='mm-k'+(m.arrasta?' arr':'');d.innerHTML=m.html;d.dataset.i=i;if(m.tip)d.title=m.tip;m.el=d;this.M.appendChild(d)});this.desenhar()}
 desenhar(){const W=this.W,H=this.H;if(!W||!H)return;const [cx,cy]=this.centroPx();const x0=cx-W/2,y0=cy-H/2;const n=2**this.z;const vis={};
  for(let tx=Math.floor(x0/256);tx<=Math.floor((x0+W)/256);tx++)for(let ty=Math.floor(y0/256);ty<=Math.floor((y0+H)/256);ty++){if(ty<0||ty>=n)continue;const k=`${this.z}/${tx}/${ty}`;vis[k]=1;let im=this.tiles[k];
   if(!im){im=document.createElement('img');im.className='mm-i';im.alt='';im.draggable=false;im.src=TILE_URL.replace('{z}',this.z).replace('{x}',((tx%n)+n)%n).replace('{y}',ty);this.tiles[k]=im;this.T.appendChild(im)}
   im.style.transform=`translate(${Math.round(tx*256-x0)}px,${Math.round(ty*256-y0)}px)`}
  Object.keys(this.tiles).forEach(k=>{if(!vis[k]){this.tiles[k].remove();delete this.tiles[k]}});
  this.mk.forEach(m=>{const [x,y]=this.paraTela(m.lat,m.lng);m.el.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px)`})}
 down(e){if(e.target.closest('.mm-b,.mm-a'))return;const k=e.target.closest('.mm-k');
  if(k&&this.mk[+k.dataset.i].arrasta){this.arr={m:this.mk[+k.dataset.i]};this.el.setPointerCapture(e.pointerId);e.preventDefault();return}

  if(this.ptrs.size===1){this.ini=[e.clientX,e.clientY];this.c0=this.centroPx();this.mov=false;this.alvo=k}

 move(e){if(this.arr){const r=this.el.getBoundingClientRect();const ll=this.daTela(e.clientX-r.left,e.clientY-r.top);this.arr.m.lat=ll[0];this.arr.m.lng=ll[1];this.arr.mov=true;this.desenhar();return}
  if(!this.ptrs.has(e.pointerId))return;this.ptrs.set(e.pointerId,[e.clientX,e.clientY]);

   if(d/this.d0>1.5){this.zoomEm(1,mx,my);this.d0=d}else if(d/this.d0<.66){this.zoomEm(-1,mx,my);this.d0=d}return}

 up(e){if(this.arr){const m=this.arr.m,mv=this.arr.mov;this.arr=null;if(mv&&m.aoSoltar)m.aoSoltar(m.lat,m.lng);return}

}
const pinoSvg=(cor,txt,estrela)=>`<svg width="30" height="40" viewBox="0 0 30 40" style="display:block"><path d="M15 39C6 27 2 21 2 14a13 13 0 0 1 26 0c0 7-4 13-13 25z" fill="${cor}" stroke="#fff" stroke-width="2"/>${estrela?'<path d="M15 6.5l2.3 4.7 5.2.8-3.8 3.6.9 5.1-4.6-2.4-4.6 2.4.9-5.1-3.8-3.6 5.2-.8z" fill="#fff"/>':txt?`<text x="15" y="18.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">${txt}</text>`:'<circle cx="15" cy="14" r="5" fill="#fff"/>'}</svg>`;

/* ---------- importar sócios por planilha (.xlsx ou .csv), sem bibliotecas ---------- */
async function lerXlsx(buf){const u=new Uint8Array(buf),dv=new DataView(buf),td=new TextDecoder();
 let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('Arquivo .xlsx inválido.');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const F={};
 for(let i=0;i<n;i++){const met=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);F[td.decode(u.subarray(p+46,p+46+nl))]={met,cs,off};p+=46+nl+el+cl}
 const ler=async nm=>{const f=F[nm];if(!f)return null;const a=dv.getUint16(f.off+26,true),b=dv.getUint16(f.off+28,true),st=f.off+30+a+b;const d=u.subarray(st,st+f.cs);
  if(f.met===0)return td.decode(d);if(typeof DecompressionStream==='undefined')throw new Error('Este navegador não abre .xlsx. Salve a planilha como CSV e tente de novo.');
  return td.decode(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())};
 const xml=t=>new DOMParser().parseFromString(t,'application/xml');
 const ss=[];const sx=await ler('xl/sharedStrings.xml');if(sx)[...xml(sx).getElementsByTagName('si')].forEach(si=>ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join('')));
 let sheet='xl/worksheets/sheet1.xml';try{const wb=xml(await ler('xl/workbook.xml'));const s1=wb.getElementsByTagName('sheet')[0];const rid=s1.getAttribute('r:id')||s1.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');const rels=xml(await ler('xl/_rels/workbook.xml.rels'));const rel=[...rels.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);if(rel){const t=rel.getAttribute('Target');sheet=t.startsWith('/')?t.slice(1):'xl/'+t.replace(/^\.\//,'')}}catch(e){}
 const sx2=await ler(sheet);if(!sx2)throw new Error('Não encontrei a primeira aba da planilha.');
 const col=r=>{let c=0;for(const ch of r.replace(/\d+/g,''))c=c*26+ch.charCodeAt(0)-64;return c-1};
 return [...xml(sx2).getElementsByTagName('row')].map(row=>{const out=[];[...row.getElementsByTagName('c')].forEach(c=>{const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val='';
  if(t==='s')val=ss[+v.textContent]||'';else if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');else if(v)val=v.textContent;
  out[col(c.getAttribute('r')||'A')]=val});return [...out].map(x=>x??'')})}
function lerCsv(buf){let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-1252').decode(buf)}t=t.replace(/^﻿/,'');
 const sep=(t.split('\n')[0].match(/;/g)||[]).length>=(t.split('\n')[0].match(/,/g)||[]).length?';':',';const rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===sep){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
const normTxt=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const COLS_IMP={nome:['nome','nomecompleto'],tel:['telefone','celular','whatsapp','fone','tel'],email:['email','correioeletronico'],oficio:['oficio','oficionaigreja','cargonaigreja'],nasc:['nascimento','datadenascimento','datanascimento','nasc'],endereco:['endereco','logradouro','enderecocompleto'],cidadeUF:['cidade','cidadeuf','municipio'],cep:['cep'],cpf:['cpf']};
function dataImp(v){v=String(v||'').trim();if(!v)return '';if(/^\d{4,6}(\.\d+)?$/.test(v)){const d=new Date(Math.round((+v-25569)*86400000));return isNaN(d)?'':d.toISOString().slice(0,10)}
 let m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=y>30?1900:2000;return `${y}-${pad(+m[2])}-${pad(+m[1])}`}
 m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:''}
function oficioImp(v){const n=normTxt(v);return n.startsWith('presb')?'Presbítero':n.startsWith('diac')?'Diácono':'Membro'}
function linhasImp(rows){rows=rows.filter(r=>r.some(c=>String(c).trim()));if(rows.length<2)return {erro:'A planilha precisa ter a linha de títulos e pelo menos um sócio.'};
 const cab=rows[0].map(normTxt);const idx={};Object.entries(COLS_IMP).forEach(([k,al])=>{const i=cab.findIndex(h=>al.includes(h));if(i>=0)idx[k]=i});
 if(idx.nome===undefined)return {erro:'Não encontrei a coluna “Nome”. Use o modelo.'};
 const u=meS().uphId;const exist=new Set(S.socios.filter(s=>s.uphId===u&&s.status!=='inativo').map(s=>normTxt(s.nome)));const emails=new Set(S.socios.filter(s=>s.email).map(s=>s.email.toLowerCase()));const vistos=new Set();
 return {itens:rows.slice(1).map((r,i)=>{const g=k=>idx[k]===undefined?'':String(r[idx[k]]??'').trim();const o={nome:g('nome').replace(/\s+/g,' '),tel:g('tel'),email:g('email').toLowerCase(),oficio:oficioImp(g('oficio')),nasc:dataImp(g('nasc')),endereco:g('endereco'),cidadeUF:g('cidadeUF'),cep:g('cep'),cpf:g('cpf')};
  let erro='';const n=normTxt(o.nome);if(!o.nome)erro='sem nome';else if(/apague esta linha/i.test(o.nome))erro='linha de exemplo';else if(exist.has(n))erro='já está no rol';else if(vistos.has(n))erro='repetido na planilha';else if(o.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email))erro='e-mail inválido';else if(o.email&&emails.has(o.email))erro='e-mail já cadastrado';
  vistos.add(n);return {linha:i+2,o,erro}})}}

 importarSocios:()=>{ctx.imp=null;openModal(`<button class="close" data-a="fechar">×</button><h2>Importar sócios por planilha</h2><p class="sub">Para cadastrar vários sócios de uma vez. Use o modelo (Excel) ou uma planilha com as mesmas colunas: <b>Nome</b> (obrigatório), Telefone, E-mail, Ofício, Data de nascimento, Endereço, Cidade-UF, CEP e CPF.</p>

});
async function arqImport(el){const f=el.files[0];const box=document.getElementById('impPrev');if(!f)return;box.innerHTML='<p class="sub">Lendo a planilha…</p>';
 try{const buf=await f.arrayBuffer();const rows=/\.csv$/i.test(f.name)?lerCsv(buf):await lerXlsx(buf);const r=linhasImp(rows);if(r.erro){box.innerHTML=`<div class="alert warn"><div>${esc(r.erro)}</div></div>`;return}
  ctx.imp=r;const ok=r.itens.filter(x=>!x.erro).length,bad=r.itens.length-ok;
  box.innerHTML=`<p><b>${ok}</b> sócio(s) prontos para importar${bad?` · <span style="color:var(--bad)">${bad} linha(s) com problema serão ignoradas</span>`:''}.</p>
  <div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px"><table class="tbl" style="width:100%;font-size:13px"><tr><th>Linha</th><th>Nome</th><th>Telefone</th><th>Situação</th></tr>${r.itens.map(x=>`<tr><td>${x.linha}</td><td>${esc(x.o.nome||'—')}</td><td>${esc(x.o.tel)}</td><td>${x.erro?`<span class="badge bad">${esc(x.erro)}</span>`:'<span class="badge ok">ok</span>'}</td></tr>`).join('')}</table></div>
  <label class="check" style="margin-top:12px"><input type="checkbox" id="impSemApp" checked> Marcar como “sem app” (a diretoria mantém os dados). Quem criar conta depois com o mesmo e-mail é ligado ao cadastro.</label>

 catch(e){box.innerHTML=`<div class="alert warn"><div>${esc(e.message||'Não foi possível ler o arquivo.')}</div></div>`}}
